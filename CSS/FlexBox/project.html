<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="pro.css">
</head>
<body style="background-color: rgb(63, 145, 118);">

  <div class="box">
    <form>
      <h1>Login Here</h1>
      <div>
        <label for="user" style="display: block;">Username</label>
        <input id="user" type="text" placeholder="Enter you Name">
      </div>   
      <div>
        <label for="pass" style="display: block;">Password</label>
        <input id="pass" type="password" placeholder="Enter your Password">
      </div>
      <button type="submit" class="button">Login</button>
    </form>
  </div>

  
</body>
</html>
